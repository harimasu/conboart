<!-- View B: generating -->
<div class="view" id="v-loading">
  <div class="generating">
    <div class="crest-load"><span class="ring"></span><b></b></div>
    <h2>Generating…</h2>
    <div class="gen-status" id="genStatus">Sending to the generator…</div>
    <div class="gen-note">This usually takes about a minute. Keep this tab open.</div>
    <button class="btn btn-ghost" style="margin-top:20px" onclick="cancelGenerate()">Cancel generation</button>
  </div>
</div>
